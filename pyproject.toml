[tool.poetry]
name = "miyoka"
version = "0.2.0"
description = "Automated replay recording tool for fighting games"
authors = ["FGC Replay Miyoka <fgcreplaymiyoka@gmail.com>"]
readme = "README.md"
packages = [{include = "miyoka"}]

[tool.poetry.scripts]
miyoka = "miyoka.cli:main"

[tool.poetry.dependencies]
python = "^3.10"
numpy = "^1.26.4"
opencv-python = "^4.9.0.80"
pillow = "^10.3.0"
python-dotenv = "^1.0.1"
python-json-logger = "^2.0.7"
black = "^24.4.2"
flake8 = "^7.0.0"
dependency-injector = {extras = ["yaml"], version = "^4.42.0"}
pytesseract = "^0.3.10"
click = "^8.1.7"
obsws-python = "^1.6.0"

[tool.poetry.group.win]
optional = true

[tool.poetry.group.win.dependencies]
dxcam = "^0.0.5"
pydirectinput = "^1.0.4"
pygetwindow = "^0.0.9"

[tool.poetry.group.linux]
optional = true

[tool.poetry.group.linux.dependencies]
mss = "^9.0.1"
python-xlib = "^0.33"
ewmh = "^0.1.6"

[tool.poetry.group.gcp]
optional = true

[tool.poetry.group.gcp.dependencies]
google-cloud-storage = "^2.16.0"
google-cloud-vision = "^3.7.2"
google-cloud-bigquery = "^3.22.0"
google-cloud-run = "^0.10.5"
google-cloud-video-transcoder = "^1.15.0"

[tool.poetry.group.analysis]
optional = true

[tool.poetry.group.analysis.dependencies]
scikit-learn = "^1.5.1"
matplotlib = "^3.9.2"
pandas = "^2.2.2"
db-dtypes = "^1.3.0"

[tool.poetry.group.frontend]
optional = true

[tool.poetry.group.frontend.dependencies]
streamlit = "^1.37.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
